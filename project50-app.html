<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Project 50</title>

  <!-- Add to Home Screen behavior on iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Project 50" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a1628" />
  <link rel="apple-touch-icon" href="./project50-icons/icon-180.png" />
  <link rel="icon" href="./project50-icons/icon-512.png" />
  <link rel="manifest" href="./project50-app.webmanifest" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0a1628;
      --blue: #1a3a6b;
      --gold: #f5a623;
      --gold-light: #ffd06b;
      --white: #ffffff;
      --silver: #c8d4e8;
      --accent: #2d7dd2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--navy); }
    body {
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }
    .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(45,125,210,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(45,125,210,0.06) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; z-index: 0; }
    .bg-glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(245,166,35,0.12) 0%, transparent 70%); top: -180px; right: -180px; pointer-events: none; z-index: 0; }
    .page { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }

    header { text-align: center; margin-bottom: 28px; }
    .eyebrow { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.6rem, 12vw, 4rem); letter-spacing: 0.04em; background: linear-gradient(135deg, var(--white) 0%, var(--gold-light) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    .subtitle { font-size: 0.95rem; color: var(--silver); margin-top: 8px; }
    .gold-line { height: 3px; width: 60px; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: 2px; margin: 16px auto 0; }

    .list { display: flex; flex-direction: column; gap: 14px; }
    .episode {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .episode:active { transform: scale(0.98); background: rgba(255,255,255,0.07); }
    .thumb {
      position: relative;
      width: 120px; height: 68px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .play-badge {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,22,40,0.25);
    }
    .play-badge svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
    .ep-info { flex: 1; min-width: 0; }
    .week-badge {
      display: inline-block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--navy);
      background: var(--gold);
      border-radius: 100px;
      padding: 2px 9px;
      margin-bottom: 6px;
    }
    .ep-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--white); line-height: 1.25; margin-bottom: 3px; }
    .ep-subtitle { font-size: 0.8rem; color: var(--silver); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .empty-note {
      text-align: center;
      color: var(--silver);
      opacity: 0.6;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .install-hint {
      margin-top: 28px;
      background: linear-gradient(135deg, rgba(245,166,35,0.12) 0%, rgba(10,22,40,0.6) 100%);
      border: 1px solid rgba(245,166,35,0.3);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.82rem;
      color: var(--silver);
      line-height: 1.5;
      display: none;
    }
    .install-hint.show { display: block; }
    .install-hint b { color: var(--gold-light); }

    footer { margin-top: 40px; text-align: center; font-size: 0.72rem; color: rgba(255,255,255,0.25); letter-spacing: 0.05em; }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="page">
  <header>
    <div class="eyebrow">Functional Core Fitness</div>
    <div class="title">PROJECT 50</div>
    <p class="subtitle">Coach Omar's road to a 100-mile ultra</p>
    <div class="gold-line"></div>
  </header>

  <div class="list" id="list"></div>
  <p class="empty-note" id="emptyNote" style="display:none;">New weeks show up here as soon as they're added.</p>

  <div class="install-hint" id="installHint">
    <b>Tip:</b> tap the Share icon in Safari, then <b>Add to Home Screen</b> to keep this as an app icon on your phone.
  </div>

  <footer>Personal tracker &middot; not part of the public exercise library</footer>
</div>

<script>
  // Add new weeks here as Coach Omar posts them.
  var episodes = [
    {
      week: 1,
      title: "The Starting Line",
      subtitle: "Building the Foundation to a 100-Mile Ultra",
      videoId: "F2Xqs6weGxw"
    }
  ];

  var list = document.getElementById('list');
  if (episodes.length === 0) {
    document.getElementById('emptyNote').style.display = 'block';
  } else {
    list.innerHTML = episodes.map(function(ep) {
      return '' +
        '<a class="episode" href="https://www.youtube.com/watch?v=' + ep.videoId + '" target="_blank" rel="noopener">' +
          '<div class="thumb">' +
            '<img src="https://img.youtube.com/vi/' + ep.videoId + '/mqdefault.jpg" alt="' + ep.title + '" loading="lazy" />' +
            '<div class="play-badge"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="12" fill="rgba(245,166,35,0.9)"/><polygon points="9.5,7 18,12 9.5,17" fill="#0a1628"/></svg></div>' +
          '</div>' +
          '<div class="ep-info">' +
            '<span class="week-badge">Week ' + ep.week + '</span>' +
            '<div class="ep-title">' + ep.title + '</div>' +
            '<div class="ep-subtitle">' + ep.subtitle + '</div>' +
          '</div>' +
        '</a>';
    }).join('');
  }

  // Show the "Add to Home Screen" hint only in mobile Safari, not already installed.
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var isStandalone = window.navigator.standalone === true;
  if (isIOS && !isStandalone) {
    document.getElementById('installHint').classList.add('show');
  }
</script>
</body>
</html>
